<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <header>
    <h1>QuickNotes</h1>
    <p>Capture your ideas in seconds.</p>
  </header>

  <main>

    <section id="add-note-section">
      <h2>Add a note</h2>

      <form id="note-form">
        <div>
          <label for="note-input">Your note</label>
          <input
            type="text"
            id="note-input"
            placeholder="Type your note..."
            maxlength="200"
          >
        </div>

        <div>
          <label for="note-category">Category</label>
          <select id="note-category">
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="study">Study</option>
          </select>
        </div>

        <button type="submit">Add Note</button>
      </form>

      <p id="error-message"></p>
    </section>

    <section id="your-notes-section">
      <h2>Your notes</h2>

      <label for="search-input">Search notes</label>
      <input
        type="search"
        id="search-input"
        placeholder="Search your notes..."
      >

      <p id="note-count">You have no notes yet.</p>

      <ul id="notes-list"></ul>

      <button type="button" id="clear-all-btn">Clear all</button>
    </section>

  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. All rights reserved.</p>
  </footer>

</body>
</html>
